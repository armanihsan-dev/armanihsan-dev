<svg viewBox="0 0 700 140" preserveAspectRatio="xMidYMid meet" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f2942"/>
      <stop offset="35%" stop-color="#1e5f8c"/>
      <stop offset="65%" stop-color="#4a9fd8"/>
      <stop offset="100%" stop-color="#8ed4f0"/>
    </linearGradient>
    <linearGradient id="accentGradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#8ed4f0"/>
      <stop offset="100%" stop-color="#1e5f8c"/>
    </linearGradient>
    <clipPath id="roundedClip">
      <rect x="0" y="0" width="700" height="140" rx="14" ry="14"/>
    </clipPath>
  </defs>

  <g clip-path="url(#roundedClip)">
    <rect x="0" y="0" width="700" height="140" fill="url(#bgGradient)"/>

    <circle cx="650" cy="20" r="70" fill="#ffffff" opacity="0.05"/>
    <circle cx="600" cy="130" r="50" fill="#ffffff" opacity="0.06"/>
    <circle cx="80" cy="120" r="90" fill="#000000" opacity="0.08"/>

    <path d="M0,140 L120,0 L160,0 L40,140 Z" fill="#ffffff" opacity="0.04"/>
    <path d="M180,140 L300,0 L330,0 L210,140 Z" fill="#ffffff" opacity="0.04"/>

    <rect x="0" y="0" width="8" height="140" fill="url(#accentGradient)"/>

    <rect x="1.5" y="1.5" width="697" height="137" rx="12" ry="12"
          fill="none" stroke="#ffffff" stroke-opacity="0.25" stroke-width="2"/>

    <text x="350" y="66" text-anchor="middle"
          font-family="'Poppins', 'Segoe UI', Arial, sans-serif"
          font-size="28" font-weight="700"
          fill="#ffffff" letter-spacing="2">
      ARMAN IHSAN
    </text>

    <text x="350" y="94" text-anchor="middle"
          font-family="'Poppins', 'Segoe UI', Arial, sans-serif"
          font-size="14" font-weight="500"
          fill="#d6f0fb" letter-spacing="3">
      &gt; SENIOR_FULL_STACK_DEVELOPER
    </text>
  </g>
</svg>
