<svg viewBox="0 0 700 140" preserveAspectRatio="xMidYMid meet" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#080808"/>
      <stop offset="100%" stop-color="#141414"/>
    </linearGradient>
  
    
    <linearGradient id="silver" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#e0e0e0"/>
      <stop offset="100%" stop-color="#a0a0a0"/>
    </linearGradient>
    
    <filter id="softGlow">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    
    <clipPath id="rounded3">
      <rect x="0" y="0" width="700" height="140" rx="12" ry="12"/>
    </clipPath>
  </defs>

  <g clip-path="url(#rounded3)">
    <rect x="0" y="0" width="700" height="140" fill="url(#bg3)"/>
    
    <!-- Subtle Pattern -->
    <g opacity="0.03">
      <circle cx="50" cy="50" r="30" fill="none" stroke="#ffffff" stroke-width="0.5"/>
      <circle cx="50" cy="50" r="60" fill="none" stroke="#ffffff" stroke-width="0.5"/>
      <circle cx="650" cy="90" r="30" fill="none" stroke="#ffffff" stroke-width="0.5"/>
      <circle cx="650" cy="90" r="60" fill="none" stroke="#ffffff" stroke-width="0.5"/>
    </g>
    
    <!-- Outer Border -->
    <rect x="8" y="8" width="684" height="124" rx="8" ry="8" 
          fill="none" stroke="#ffffff" stroke-opacity="0.06" stroke-width="1"/>
    
    <!-- Inner Border -->
    <rect x="16" y="16" width="668" height="108" rx="6" ry="6" 
          fill="none" stroke="#ffffff" stroke-opacity="0.04" stroke-width="0.5"/>
    
    <!-- Top Gold Line -->
    <line x1="200" y1="16" x2="500" y2="16" stroke="url(#gold)" stroke-width="1.5" opacity="0.6"/>
    
    <!-- Bottom Gold Line -->
    <line x1="200" y1="124" x2="500" y2="124" stroke="url(#gold)" stroke-width="1.5" opacity="0.6"/>
    
    <!-- Name -->
    <text x="350" y="58" text-anchor="middle"
          font-family="'Outfit', sans-serif"
          font-size="34" font-weight="700"
          fill="#ffffff" letter-spacing="8">
      ARMAN IHSAN
    </text>
    
    <!-- Gold Divider -->
    <line x1="310" y1="74" x2="390" y2="74" stroke="url(#gold)" stroke-width="1.5" opacity="0.8"/>
    
    <!-- Title -->
    <text x="350" y="98" text-anchor="middle"
          font-family="'Outfit', sans-serif"
          font-size="13" font-weight="400"
          fill="#888888" letter-spacing="6">
      SENIOR FULL STACK ENGINEER
    </text>
    
    <!-- Side Decorations -->
    <text x="30" y="110" font-family="'Inter', sans-serif" font-size="9" 
          fill="#888888" opacity="0.3" letter-spacing="1">
      NESTJS · REACT · TYPESCRIPT
    </text>
    
    <text x="460" y="110" font-family="'Inter', sans-serif" font-size="9" 
          fill="#888888" opacity="0.3" letter-spacing="1">
      AWS · DOCKER · POSTGRES
    </text>
    
    <!-- Diamond Decoration -->
    <polygon points="350,86 354,90 350,94 346,90" fill="url(#gold)" opacity="0.4"/>
  </g>
</svg>