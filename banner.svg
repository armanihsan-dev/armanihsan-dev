<svg viewBox="0 0 700 140" preserveAspectRatio="xMidYMid meet" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Matte Charcoal Background -->
    <radialGradient id="matteGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#1a1a1a"/>
      <stop offset="100%" stop-color="#0a0a0a"/>
    </radialGradient>

    <!-- Grain/Noise Filter for Texture -->
    <filter id="noise">
      <feTurbulence type="fractalNoise" baseFrequency="0.65" numOctaves="3" stitchTiles="stitch"/>
      <feColorMatrix type="saturate" values="0"/>
      <feComponentTransfer>
        <feFuncA type="linear" slope="0.05"/>
      </feComponentTransfer>
      <feBlend in="SourceGraphic" mode="overlay"/>
    </filter>

    <clipPath id="rectClip">
      <rect width="700" height="140" rx="4"/>
    </clipPath>
  </defs>

  <g clip-path="url(#rectClip)">
    <!-- Base Layer -->
    <rect width="700" height="140" fill="url(#matteGrad)"/>
    <rect width="700" height="140" fill="#ffffff" opacity="0.05" filter="url(#noise)"/>

    <!-- Structural Grid Lines -->
    <g stroke="#ffffff" stroke-opacity="0.08" stroke-width="0.5">
      <line x1="100" y1="0" x2="100" y2="140"/>
      <line x1="600" y1="0" x2="600" y2="140"/>
      <line x1="0" y1="70" x2="700" y2="70"/>
    </g>

    <!-- Background "Large" Initials -->
    <text x="50%" y="95" text-anchor="middle"  font-family="'Outfit', sans-serif"  font-size="120" font-weight="900" fill="#ffffff" fill-opacity="0.02" letter-spacing="-5">
      ARMAN
    </text>

    <!-- Main Content Frame -->
    <rect x="110" y="20" width="480" height="100" fill="none" stroke="#ffffff" stroke-opacity="0.2" stroke-dasharray="2,2"/>
    


    <!-- Primary Name Styling -->
    <text x="350" y="72" text-anchor="middle" font-family="'Inter', sans-serif" font-size="32" font-weight="800" fill="#ffffff" letter-spacing="15">
      ARMAN IHSAN
    </text>

    <!-- Title with Scanning Lines -->
    <g>
      <text x="350" y="94" text-anchor="middle" font-family="'Inter', sans-serif" font-size="10" font-weight="400" fill="#ffffff" fill-opacity="0.6" letter-spacing="6">
        SENIOR FULL STACK ENGINEER
      </text>
  
    </g>

    <!-- Tech Skill Pills (Monochrome) -->
    <g transform="translate(180, 132)"  font-family="monospace" font-size="7" fill="#ffffff" fill-opacity="0.3">
      <text x="0" y="0">NESTJS</text>
      <circle cx="45" cy="-2" r="1.5" fill="#ffffff" fill-opacity="0.2"/>
      <text x="60" y="0">TYPESCRIPT</text>
      <circle cx="125" cy="-2" r="1.5" fill="#ffffff" fill-opacity="0.2"/>
      <text x="140" y="0">REACT</text>
      <circle cx="185" cy="-2" r="1.5" fill="#ffffff" fill-opacity="0.2"/>
      <text x="200" y="0">DOCKER</text>
      <circle cx="250" cy="-2" r="1.5" fill="#ffffff" fill-opacity="0.2"/>
      <text x="265" y="0">AWS</text>
    </g>

    <!-- Corner Accents -->
    <path d="M0 20 L5 20 M0 120 L5 120" stroke="#ffffff" stroke-opacity="0.5" fill="none"/>
    <path d="M700 20 L695 20 M700 120 L695 120" stroke="#ffffff" stroke-opacity="0.5" fill="none"/>
  </g>
</svg>