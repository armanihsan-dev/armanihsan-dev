<svg viewBox="0 0 800 380" preserveAspectRatio="xMidYMid meet" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="matteGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0a0a"/>
      <stop offset="100%" stop-color="#121212"/>
    </linearGradient>

    <linearGradient id="silver" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.8"/>
      <stop offset="50%" stop-color="#888888" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.8"/>
    </linearGradient>

    <filter id="noise">
      <feTurbulence type="fractalNoise" baseFrequency="0.7" numOctaves="3" stitchTiles="stitch"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.03"/></feComponentTransfer>
    </filter>
  </defs>

  <!-- Background Layer -->
  <rect width="800" height="380" rx="4" fill="url(#matteGrad)"/>
  <rect width="800" height="380" rx="4" fill="white" filter="url(#noise)"/>

  <!-- Blueprint Grid -->
  <g stroke="white" stroke-opacity="0.04" stroke-width="0.5">
    <path d="M0 40 H800 M0 340 H800"/>
    <path d="M40 0 V380 M760 0 V380"/>
    <circle cx="40" cy="40" r="2" fill="white" fill-opacity="0.2"/>
    <circle cx="760" cy="340" r="2" fill="white" fill-opacity="0.2"/>
  </g>

  <!-- Header -->
  <text x="60" y="32" font-family="monospace" font-size="8" fill="#ffffff" fill-opacity="0.4" letter-spacing="2">
    BACKEND_CAPABILITIES // STACK_CORE_v2
  </text>
  
  <text x="60" y="75" font-family="'Inter', sans-serif" font-size="24" font-weight="800" fill="#ffffff" letter-spacing="-0.5">
    Full Stack Systems Architect
  </text>
  <rect x="60" y="88" width="40" height="2" fill="url(#silver)"/>

  <!-- Content Section -->
  <g font-family="'Inter', sans-serif" font-size="14" fill="#bbbbbb" line-height="1.6">
    <!-- Backend Logic -->
    <text x="60" y="125">
      <tspan font-weight="600" fill="#ffffff">Backend Orchestration:</tspan> Architecting high-throughput services via 
      <tspan fill="#ffffff">NestJS</tspan>, 
      <tspan fill="#ffffff">Fastify</tspan>, and 
      <tspan fill="#ffffff">Express</tspan>.
    </text>
    
    <!-- Database/TypeScript -->
    <text x="60" y="148">
      Utilizing <tspan font-weight="600" fill="#ffffff">Strict TypeScript</tspan> for end-to-end type-safety across relational 
      (<tspan fill="#ffffff">PostgreSQL</tspan>) and 
    </text>
    <text x="60" y="168">
      document-based (<tspan fill="#ffffff">MongoDB</tspan>) schemas, optimized with <tspan fill="#ffffff">Redis</tspan> for distributed state.
    </text>

    <!-- Project Box -->
    <rect x="60" y="190" width="680" height="85" rx="2" fill="#ffffff" fill-opacity="0.03" stroke="#ffffff" stroke-opacity="0.1"/>
    
    <text x="80" y="212" font-size="10" font-family="monospace" fill="#ffffff" fill-opacity="0.4">PROD_ENV: STORIFYY.CLOUD</text>
    
    <text x="80" y="235" font-size="13" fill="#dddddd">
      Engineered a <tspan fill="#ffffff">Node.js streaming core</tspan> for cloud storage, managing asynchronous 
    </text>
    <text x="80" y="255" font-size="13" fill="#dddddd">
      processing with Redis queues and resilient AWS S3 infrastructure orchestration.
    </text>
  </g>

  <!-- Professional Philosophy -->
  <text x="60" y="305" font-family="'Inter', sans-serif" font-size="13" font-style="italic" fill="#888888">
    "Prioritizing immutable logic, system scalability, and zero-trust type architecture."
  </text>

  <!-- Footer -->
  <g font-family="monospace" font-size="9" fill="#ffffff" fill-opacity="0.3">
    <text x="60" y="358">AVAILABILITY: REMOTE_INTL</text>
    <text x="400" y="358" text-anchor="middle">PRIMARY_RUNTIME: NODE_TS_LTS</text>
    <text x="740" y="358" text-anchor="end">ENCRYPTED_SIGNAL_ACTIVE</text>
  </g>

  <!-- Right Side Icon Decoration -->
  <g transform="translate(690, 50)">
    <rect x="0" y="0" width="40" height="40" stroke="#ffffff" stroke-opacity="0.1" fill="none"/>
    <path d="M10 20 H30 M20 10 V30" stroke="#ffffff" stroke-opacity="0.3" stroke-width="1"/>
    <text x="20" y="48" text-anchor="middle" font-size="6" fill="#ffffff" fill-opacity="0.3">SYS_REF</text>
  </g>
</svg>