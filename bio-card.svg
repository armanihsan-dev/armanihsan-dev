<svg viewBox="0 0 800 380" preserveAspectRatio="xMidYMid meet" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#080808"/>
      <stop offset="100%" stop-color="#141414"/>
    </linearGradient>
    

    
    <filter id="softGlow">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    
    <clipPath id="rounded3">
      <rect x="0" y="0" width="800" height="380" rx="12" ry="12"/>
    </clipPath>
  </defs>

  <g clip-path="url(#rounded3)">
    <rect x="0" y="0" width="800" height="380" fill="url(#bg3)"/>
    
    <!-- Subtle Pattern -->
    <g opacity="0.03">
      <circle cx="60" cy="60" r="40" fill="none" stroke="#ffffff" stroke-width="0.5"/>
      <circle cx="60" cy="60" r="70" fill="none" stroke="#ffffff" stroke-width="0.5"/>
      <circle cx="740" cy="320" r="40" fill="none" stroke="#ffffff" stroke-width="0.5"/>
      <circle cx="740" cy="320" r="70" fill="none" stroke="#ffffff" stroke-width="0.5"/>
    </g>
    
    <!-- Outer Border -->
    <rect x="8" y="8" width="784" height="364" rx="8" ry="8" 
          fill="none" stroke="#ffffff" stroke-opacity="0.06" stroke-width="1"/>
    
    <!-- Inner Border -->
    <rect x="16" y="16" width="768" height="348" rx="6" ry="6" 
          fill="none" stroke="#ffffff" stroke-opacity="0.04" stroke-width="0.5"/>
    
    <!-- Top Gold Line -->
    <line x1="200" y1="16" x2="600" y2="16" stroke="url(#gold)" stroke-width="1.5" opacity="0.6"/>
    
    <!-- Bottom Gold Line -->
    <line x1="200" y1="364" x2="600" y2="364" stroke="url(#gold)" stroke-width="1.5" opacity="0.6"/>
    
    <!-- ===== SECTION LABEL ===== -->
    <text x="40" y="50" font-size="11" font-weight="600" 
    font-family="'Outfit', sans-serif"
    fill="#f6d365" letter-spacing="4" >
      ABOUT ME
    </text>
    
    <!-- ===== MAIN HEADLINE ===== -->
    <text x="40" y="90" font-size="20" font-weight="700" 
    font-family="'Outfit', sans-serif"
          fill="#ffffff" letter-spacing="1">
      Senior Full-Stack Engineer
    </text>
    <text x="40" y="114" font-size="14" font-weight="400" 
    font-family="'Outfit', sans-serif"
          fill="#888888" letter-spacing="0.5">
      with 5+ years of experience building production-grade SaaS platforms from 0 to 1.
    </text>
    
    <!-- Gold Divider -->
    <line x1="40" y1="132" x2="200" y2="132" stroke="url(#gold)" stroke-width="1" opacity="0.4"/>
    
    <!-- ===== BODY COPY ===== -->
    <g font-size="14" font-weight="400" fill="#888888" letter-spacing="0.3" font-family="'Outfit', sans-serif">
      
      <text x="40" y="165">
        I specialize in the <tspan fill="#f6d365" font-weight="600">MERN stack</tspan> with
      </text>
      
      <text x="40" y="189">
        <tspan fill="#f6d365" font-weight="600">AWS</tspan> (EC2, S3, Lambda, CloudFront) and have built
      </text>
      
      <text x="40" y="213">
        <tspan fill="#f6d365" font-weight="600">Storifyy.cloud</tspan> — a complete Google Drive
      </text>
      
      <text x="40" y="237">
        alternative with subscription billing, Redis queues,
      </text>
      
      <text x="40" y="261">
        and serverless architecture — entirely solo.
      </text>
      
      <text x="40" y="293">
        From system design to deployment pipelines, I handle
      </text>
      
      <text x="40" y="317" font-weight="500" fill="#aaaaaa">
        the full stack of decisions, not just the code between them.
      </text>
      
    </g>
    
    <!-- ===== CTA PILL ===== -->
    <rect x="0" y="0" width="310" height="28" rx="14" ry="14" fill="none"/>
    <g transform="translate(40, 338)">
      <rect x="0" y="0" width="310" height="28" rx="14" ry="14" fill="url(#gold)"/>
    <text  y="20"
        font-size="12"
        font-family="'Outfit', sans-serif"
        fill="#f5f3ed" letter-spacing="0.8">
    Open to Remote Full-Stack Roles
  </text>
    </g>
    
    <!-- ===== TECH TAGS ===== -->
    <text x="580" y="360" font-size="9" font-weight="400" 
          fill="#888888" opacity="0.3" letter-spacing="2">
      NESTJS · REACT · TYPESCRIPT · AWS
    </text>
    

  </g>
</svg>