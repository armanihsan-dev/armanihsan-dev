<svg viewBox="0 0 900 160" preserveAspectRatio="xMidYMid meet" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Matte Obsidian Background -->
    <linearGradient id="matteGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0a0a"/>
      <stop offset="100%" stop-color="#121212"/>
    </linearGradient>

    <!-- Silver Chrome Gradient -->
    <linearGradient id="silverChrome" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.8"/>
      <stop offset="50%" stop-color="#888888" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.8"/>
    </linearGradient>

    <!-- Grain/Noise Filter -->
    <filter id="noise">
      <feTurbulence type="fractalNoise" baseFrequency="0.75" numOctaves="3" stitchTiles="stitch"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.04"/></feComponentTransfer>
    </filter>
  </defs>

  <!-- Background Base -->
  <rect width="900" height="160" rx="4" fill="url(#matteGrad)"/>
  <rect width="900" height="160" rx="4" fill="white" filter="url(#noise)"/>

  <!-- Blueprint Grid lines -->
  <g stroke="white" stroke-opacity="0.04" stroke-width="0.5">
    <path d="M0 40 H900 M0 120 H900"/>
    <path d="M45 0 V160 M855 0 V160"/>
  </g>

  <!-- Corner Brackets -->
  <g stroke="#ffffff" stroke-opacity="0.2" stroke-width="1" fill="none">
    <path d="M15 30 V15 H30"/> <!-- TL -->
    <path d="M870 15 H885 V30"/> <!-- TR -->
    <path d="M15 130 V145 H30"/> <!-- BL -->
    <path d="M870 145 H885 V130"/> <!-- BR -->
  </g>

  <!-- Section Label -->
  <text x="50" y="38" font-family="monospace" font-size="8" fill="#ffffff" fill-opacity="0.4" letter-spacing="3">
    0xFF // CONNECT_GATEWAY
  </text>

  <!-- Main Footer Message -->
  <text x="50" y="85" font-family="'Inter', sans-serif" font-size="22" font-weight="200" fill="#ffffff" letter-spacing="1">
    Available for <tspan font-weight="800" fill="url(#silverChrome)">Senior Architect</tspan> Roles 
  </text>
  <text x="50" y="112" font-family="'Inter', sans-serif" font-size="14" fill="#888888" letter-spacing="0.5">
    Strategic full-stack engineering for high-throughput backends and resilient, scalable cloud systems.
  </text>

  <!-- Operational Status UI -->
  <g transform="translate(50, 135)">
    <circle cx="4" cy="-4" r="3" fill="#ffffff" fill-opacity="0.8"/>
    <text x="15" y="0" font-family="monospace" font-size="9" fill="#ffffff" fill-opacity="0.6">
      STATUS: OPEN_FOR_DEPLOYMENT_2026
    </text>
  </g>

  <!-- Data Visual Accent (Right Side Barcode-style) -->
  <g transform="translate(780, 60)" opacity="0.2">
    <rect x="0" y="0" width="2" height="40" fill="#fff"/>
    <rect x="5" y="0" width="6" height="40" fill="#fff"/>
    <rect x="15" y="0" width="1" height="40" fill="#fff"/>
    <rect x="20" y="0" width="4" height="40" fill="#fff"/>
    <rect x="30" y="0" width="8" height="40" fill="#fff"/>
    <rect x="42" y="0" width="2" height="40" fill="#fff"/>
    <text x="0" y="52" font-family="monospace" font-size="7" fill="#fff">SIG_VERIFIED</text>
  </g>

  <!-- Bottom Coordinate Metadata -->
  <g font-family="monospace" font-size="7" fill="#ffffff" fill-opacity="0.2">
    <text x="450" y="152" text-anchor="middle">EOF // NODE_TERMINATED_SUCCESSFULLY</text>
    <text x="855" y="152" text-anchor="end">MTU: 1500</text>
  </g>
</svg>