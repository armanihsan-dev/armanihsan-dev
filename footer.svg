<svg viewBox="0 0 900 160" preserveAspectRatio="xMidYMid meet" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="footerBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b1120"/>
      <stop offset="55%" stop-color="#101d34"/>
      <stop offset="100%" stop-color="#15294a"/>
    </linearGradient>
    <linearGradient id="footerAccent" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#8ed4f0"/>
      <stop offset="100%" stop-color="#1e5f8c"/>
    </linearGradient>
    <clipPath id="footerClip">
      <rect x="0" y="0" width="900" height="160" rx="18" ry="18"/>
    </clipPath>
  </defs>

  <g clip-path="url(#footerClip)">
    <rect x="0" y="0" width="900" height="160" fill="url(#footerBg)"/>

    <!-- decorative elements -->
    <circle cx="80" cy="140" r="70" fill="#4a9fd8" opacity="0.04"/>
    <circle cx="820" cy="20" r="80" fill="#8ed4f0" opacity="0.05"/>

    <!-- left accent bar -->
    <rect x="0" y="0" width="6" height="160" fill="url(#footerAccent)"/>

    <!-- border -->
    <rect x="1" y="1" width="898" height="158" rx="17" ry="17"
          fill="none" stroke="#8ed4f0" stroke-opacity="0.12" stroke-width="1.5"/>

    <g font-family="'Poppins', 'Segoe UI', Arial, sans-serif">
      
      <!-- Status Indicator (Centered) -->
      <circle cx="400" cy="95" r="4" fill="#27c93f" opacity="0.9"/>
      <text x="410" y="99" font-size="11" font-weight="500" fill="#27c93f" opacity="0.8" letter-spacing="2">
        OPEN TO WORK
      </text>

      <!-- Footer Message (Centered) -->
      <text x="450" y="126" text-anchor="middle" font-size="14" font-weight="400" fill="#5a7a9a" letter-spacing="0.5">
        ⚡ Available for Senior Full-Stack Roles &amp; Select Contracts
      </text>

    </g>
  </g>
</svg>