<svg viewBox="0 0 900 160" preserveAspectRatio="xMidYMid meet" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="footerBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#080808"/>
      <stop offset="100%" stop-color="#141414"/>
    </linearGradient>
    
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f6d365"/>
      <stop offset="100%" stop-color="#fda085"/>
    </linearGradient>
    
    <filter id="softGlow">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    
    <clipPath id="footerClip">
      <rect x="0" y="0" width="900" height="160" rx="12" ry="12"/>
    </clipPath>
  </defs>

  <g clip-path="url(#footerClip)">
    <rect x="0" y="0" width="900" height="160" fill="url(#footerBg)"/>
    
    <!-- Subtle Pattern -->
    <g opacity="0.025">
      <circle cx="60" cy="140" r="40" fill="none" stroke="#f6d365" stroke-width="0.5"/>
      <circle cx="60" cy="140" r="70" fill="none" stroke="#f6d365" stroke-width="0.5"/>
      <circle cx="840" cy="20" r="40" fill="none" stroke="#f6d365" stroke-width="0.5"/>
      <circle cx="840" cy="20" r="70" fill="none" stroke="#f6d365" stroke-width="0.5"/>
    </g>
    
    <!-- Outer Border -->
    <rect x="8" y="8" width="884" height="144" rx="8" ry="8" 
          fill="none" stroke="#ffffff" stroke-opacity="0.06" stroke-width="1"/>
    
    <!-- Inner Border -->
    <rect x="16" y="16" width="868" height="128" rx="6" ry="6" 
          fill="none" stroke="#ffffff" stroke-opacity="0.04" stroke-width="0.5"/>
    
    <!-- Top Gold Line -->
    <line x1="250" y1="16" x2="650" y2="16" stroke="url(#gold)" stroke-width="1.5" opacity="0.5"/>
    
    <!-- Bottom Gold Line -->
    <line x1="250" y1="144" x2="650" y2="144" stroke="url(#gold)" stroke-width="1.5" opacity="0.5"/>
    
    <g font-family="'Outfit', 'Inter', 'Segoe UI', Arial, sans-serif">
      
      <!-- ===== SECTION LABEL ===== -->
      <text x="40" y="52" font-size="11" font-weight="600" 
      font-family="'Outfit', sans-serif"
            fill="#f6d365" letter-spacing="4" >
        CONTACT
      </text>
      
      
      <!-- ===== FOOTER MESSAGE ===== -->
      <text x="40" y="90" font-size="15" font-weight="400" 
      font-family="'Outfit', sans-serif"
            fill="#888888" letter-spacing="0.8">
       Available for Senior Full-Stack Roles &amp; Select Contracts. 
      </text>
      
          <g>
        <text x="40" y="136" font-size="30" font-weight="400" 
              fill="#f6d365" letter-spacing="2">
          🍀
        </text>
      </g>
      <!-- ===== DIAMOND DECORATION ===== -->
      <polygon points="860,20 868,28 860,36 852,28" 
               fill="url(#gold)" opacity="0.25"/>
      
      <!-- ===== GOLD ACCENT DOT ===== -->
      <circle cx="870" cy="140" r="2" fill="#f6d365" opacity="0.15"/>
      
    </g>
  </g>
</svg>